# Decisions on story material. Project setting (decided): the experience is set BEFORE the events of the book.
# Anything that depends on the book's characters or their actions is out. Rare "outside" traces and visitor
# marks are in, as opt-in packs defined in design/packs.yaml (not canon: they are our design).
version: 1
setting: "Set before the events of the book. No character from the story exists yet or acts."
excluded:
  - {id: X-001, what: "The story's people (the two living inhabitants, the older visitor, the newcomer)", decision: excluded, why: "Character piece; setting precedes the story."}
  - {id: X-002, what: "The ritual, the 'Great and Secret Knowledge', the invoked king", decision: excluded, why: "Character piece."}
  - {id: X-003, what: "The inhabitant's notebooks, journals and index system", decision: excluded, why: "Character piece. (A player-facing journal, if ever wanted, is a separate design feature, not canon.)"}
  - {id: X-004, what: "The glimpse of the outside world through the shadows between the south-east minotaurs in the First Vestibule (draught, smell of rain and metal, faint foreign voices)", decision: included_as_pack, pack: outside_traces, why: "Rare, ambient, no characters."}
  - {id: X-005, what: "The coordinated Flood", decision: split, why: "As a story event with a trap, excluded. As a natural rare conjunction of tides it is already canon (T-015, T-018, T-019); the sim may produce one."}
  - {id: X-006, what: "Messages left in chalk or pebbles", decision: included_as_pack, pack: visitor_marks, why: "Visitors can leave preset generic marks (never free text). The story's own messages and the torn-paper scraps in gull nests stay out."}
  - {id: X-007, what: "Real-world scenes (Part 5 and most of Part 7), read in full in milestone 5", decision: excluded, why: "Story; the 'outside' is only ever hinted at (outside_traces)."}
  - {id: X-008, what: "Gifts brought in by the other inhabitant (sleeping bag, bowls, nets, shoes, camera, etc.)", decision: excluded, why: "Character piece."}
  - {id: X-009, what: "Crisp packets, fish-finger wrappers, an old sleeping bag and similar litter in and near the First Vestibule", decision: included_as_pack, pack: outside_traces, why: "Rare drifting traces of the outside; no authorship implied."}
  - {id: X-010, what: "The inhabitant's personal named constellations and year names", decision: excluded, why: "Character piece. The engine ships neutral sky names."}
  - {id: X-011, what: "In-world explanations of why the statues exist, and talk of the House causing forgetting", decision: excluded, why: "Lore from characters. The statues' origin stays unexplained."}
  - {id: X-012, what: "Perfumes, a torch/phone, a kayak-style boat, a firearm", decision: excluded, why: "Character items."}
  - {id: X-014, what: "The specific story content of earlier-visitor leftovers: the lunch-and-directions note, the angry notebook pages, the yellow-chalk route and its messages, the pebble-letter question", decision: excluded, why: "Story. The generic idea (litter, a sleeping bag, notes, scraps, old door marks) is in, as the previous_visitors pack. Our own authored fragments replace any wording."}
  - {id: X-013, what: "A body placed in the lower halls and later among the Dead", decision: excluded, why: "Story event."}
