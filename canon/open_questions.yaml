version: 0
questions:
  - {id: Q-001, q: "How are hall ordinals counted?", decision: "Ordinal = ring (max(|x|,|y|)) along the nearest of eight rays; off-ray halls are named with a row offset. See design/layout-decisions.md.", status: done}
  - {id: Q-002, q: "Do vestibules sit between halls?", decision: "One per 3x3 block at a hashed position, never on a ray; First and Ninth pinned. See design/layout-decisions.md for deviations.", status: done}
  - {id: Q-003, q: "Hall dimensions: use the 200 x 120 m reconciliation D-H1 (short axis ~105-120 m, long axis ~225 m)?", proposal: "Yes. It satisfies every stated measurement and matches the 'size varies by location' decision."}
  - {id: Q-004, q: "Length of one in-world day and year at timeScale 1.", proposal: "24 h day, 365-day year, 12 months. Year names (X-010) unneeded."}
  - {id: Q-005, q: "Which tides exist in total and what are their periods?", evidence: "Only east/west/north tide characters are given, plus a south tide implied (blue-green), and an 8-year triple join.", proposal: "Define 8 tide sources (one per compass sector) with periods of coprime lengths chosen so that east+west+north align every 8 years; document it as a design choice (confidence: guess)."}
  - {id: Q-006, q: "How many levels are there, and are they single floors or layers?", decision: "Three levels, one floor each (Lower, Middle, Upper), as the text states. The code types levels as 0|1|2. Layers with several floors are not modelled.", evidence: "Narrator: three Levels, each a Domain. Neighbouring floors are always singular (the Lower Hall directly beneath, the Upper Hall directly above). In the great flood nobody climbs floors; they scale statues in the same hall, and the heavy climbs are single 25 m staircases.", status: done}
  - {id: Q-007, q: "Should the 'bird messages' be a playable mechanic or just flavour?", proposal: "Flavour first (flocks perch on thematically related statues); optional puzzle later."}
  - {id: Q-008, q: "Do people exist in this version? The book has two inhabitants.", proposal: "No NPCs. Players are the only people. Footprints and traces only."}
  - {id: Q-009, q: "Are 'repeated statue' rules strict?", evidence: "The book says unique, or repeats only at vast distances.", proposal: "Strict uniqueness within 5 km; allow repeats beyond; test RL-005."}
  - {id: Q-010, q: "Line-by-line read of Parts 3, 4 and 6 for missed statues and places.", status: done, result: "Read in full; 5 new statues, 7 landmarks, flood-forecast figures, owl, swan, hiding/climbing rules added. Part 5 and the rest of Part 7 are real-world scenes with no new House facts."}
  - {id: Q-011, q: "Explored extents reach 960 halls west with no edge in sight: is the world bounded?", proposal: "World is unbounded; the generator never says 'edge'."}
  - {id: Q-013, q: "Which moment before the book do we simulate?", decision: "After the ceiling collapse; the House appears as it does at the start of the book (cloud zone in the North-East, the albatross pair and chick, gull colony, etc.). No era option.", status: done}
  - {id: Q-014, q: "How long do visitor marks last?", decision: "As long as someone is connected who has, or could have, seen them: witness-based, per hall (see design/packs.yaml). The author leaving does not erase a mark another visitor has seen.", status: done}
  - {id: Q-015, q: "Witness rule: a visitor counts as a witness if they were in the hall or in one of its doorways.", decision: "Confirmed.", status: done}
  - {id: Q-016, q: "Do visitors need to eat and drink?", decision: "No survival. Food is flavour and craft material only.", status: done}
  - {id: Q-017, q: "Occasional incoherent muttering from the visitor's character.", decision: "Yes. Planned as milestone 6, after the unread book sections are read (milestone 5). Needs reverb and effects, so it goes through Web Audio. See design/mutter.yaml.", status: planned}
  - {id: Q-018, q: "Line-by-line read of Part 5 and the middle of Part 7.", status: done, result: "Read in full. The statues in Part 7 were already in statues.yaml (ST-KNEELING-SPHERE, ST-HERETIC-POPE, ST-QUEEN-CHARIOT, ST-LANTERN-WALKER, ST-KING-CITY, ST-CHILDREN-FLUTE, ST-RECLINING-SNAKES). New: arrival sensations ARR-001 to ARR-006 in senses.yaml. Everything else in these parts is plot and stays excluded."}
  - {id: Q-012, q: "Are the Dead on by default?", decision: "Yes. All settings default to on, including showDead; visitors choose to turn things off.", status: done}
