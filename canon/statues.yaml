# Statues. Own-words paraphrase; src = line in owner's text export.
version: 0

# ---------------------------------------------------------------------------
# General rules. Each becomes a property test in M1 (see rules.yaml).
# ---------------------------------------------------------------------------
rules:
  - {id: S-R01, fact: "Every hall, vestibule, staircase and passage has statues on its walls. Most halls are packed with them.", src: 95, confidence: stated}
  - {id: S-R02, fact: "Statues stand in tiers rising up the walls, in big rooms numbering hundreds to about a thousand per hall.", src: [71, 531, 1927], confidence: stated}
  - {id: S-R03, fact: "Deliberate absences exist: a vacant plinth, niche or apse, or a bare stretch of an otherwise full wall. They are rare but meaningful.", src: 95, confidence: stated}
  - {id: S-R04, fact: "Size is roughly uniform within one hall but varies a lot between halls: shoulder-high, life-size, 2-3 times human height.", src: 97, confidence: stated}
  - {id: S-R05, fact: "In the Drowned Halls statues are gigantic, 15-20 m high; this is the exception.", src: 97, confidence: stated}
  - {id: S-R06, fact: "Most statues show serene, joyful or distantly calm expressions. A few halls are exceptions: wholly violent scenes with screaming faces (the upper hall above the Nineteenth Eastern Hall region).", src: 499, confidence: stated}
  - {id: S-R07, fact: "Some halls show a crowd rather than individuals: a jumbled mass not arranged in tiers (192nd Western Hall).", src: 873, confidence: stated}
  - {id: S-R08, fact: "All statues are unique. If there are repetitions they occur only at vast distances.", src: 667, confidence: stated}
  - {id: S-R09, fact: "Subjects are classical, allegorical, mythological, animal or trade figures. No modern objects or technology.", src: 'whole list', confidence: inferred}
  - {id: S-R10, fact: "Many statues carry an allegorical meaning (industriousness, innocence, strength, endeavour). Pairs and groups of statues can be read as messages (used by birds).", src: [243, 531, 575], confidence: stated}
  - {id: S-R11, fact: "Statues of the same subject type are not necessarily placed together by size; adjacent halls usually share characteristics.", src: 499, confidence: inferred}
  - {id: S-R12, fact: "Condition is determined by exposure: statues in tide-reached halls wear rags of seaweed and crusts of shellfish; dry halls are clean; falls of fresh water wear grooves; in derelict regions statues fall and shatter; bird droppings coat favoured perches.", src: [483, 505, 665, 843], confidence: stated}
  - {id: S-R13, fact: "In winter statues wear snow and outstretched arms hold icicles; wind passing through crevices and hollows makes some statues whistle or sing.", src: [391, 399], confidence: stated}
  - {id: S-R14, fact: "In the Coral Halls, coral growth transforms statues: crowns, hands turned to stars or flowers, horns, branches, cages, flame-like cover.", src: 3495, confidence: stated}
  - {id: S-R15, fact: "Statues use small details heavily: tiny marble bees, expressions that mean more than one thing, a carved shield with clouds on it.", src: [73, 241, 555], confidence: stated}
  - {id: S-R16, fact: "Some statues bridge between floor and wall by emerging from it at the waist or back, forming a platform, pocket, or ledge that a person can use for climbing, sitting or fishing.", src: [243, 473, 3071], confidence: stated}
  - {id: S-R17, fact: "Statues lining staircases exist; steps are on a giant scale.", src: 839, confidence: stated}

size_classes:
  # derived from S-R04 / S-R05 and named statues; values are a design starting point
  - {id: small, rough_height_m: "about shoulder height (~1.4)", where: "common in some halls", src: 97}
  - {id: life, rough_height_m: "~1.8", where: "common", src: 97}
  - {id: large, rough_height_m: "~3.5-5.5 (2-3x human)", where: "common in halls and vestibules", src: [97, 73]}
  - {id: huge, rough_height_m: "~6-9", where: "named: Horned Giants (~6), Minotaurs (~9)", src: [243, 1169]}
  - {id: colossal, rough_height_m: "15-20", where: "Drowned Halls only", src: 97}

moods:
  - {id: serene, fact: "tranquil, kindly or mildly smiling", src: 499}
  - {id: joyful, fact: "playing, laughing, celebrating", src: [499, 3746]}
  - {id: solemn, fact: "weighty, reverent, protective", src: [241, 1169, 3702]}
  - {id: effort, fact: "straining against something; contorted but determined", src: 243}
  - {id: violent, fact: "fighting, being carried off, mauled; faces in rage or anguish. Region-wide, not mixed in among serene ones", src: 499}
  - {id: crowd, fact: "a crowd looking toward something, intimate gestures between neighbours", src: 873}

