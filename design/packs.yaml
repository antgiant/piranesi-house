# Design (not canon): opt-in content packs and their rules. Each is a config toggle.
version: 0
config_defaults:
  showDead: true      # every setting defaults to on; visitors turn off what they don't want
  packs: {outside_traces: true, visitor_marks: true, previous_visitors: true}
  inventory: true
  relicDensity: 1.0   # multiplier; 0 turns relics off

packs:
  - id: outside_traces
    status: "IMPLEMENTED (milestone 4b). See design/relics-and-outside.md."
    default: true
    from_canon: [X-004, X-009]
    intent: "Very rare hints that an outside exists. Nothing to enter, no one to meet."
    rules:
      - "Frequency: very low and strictly rate-limited (suggested: at most one event per player per in-world day, most days none)."
      - "Effects are ambient: a cold draught with a smell of rain and metal, a few seconds of muffled foreign voices or traffic-like sound, a crumpled wrapper blown across a pavement."
      - "Places: mostly in and near the First Vestibule, especially between the two south-east minotaurs; elsewhere only the rarest sound/wrapper events."
      - "Objects: crisp packets, food wrappers, an old sleeping bag under the great stair. They vanish after a short time; none can be picked up or used."
      - "Voices: wordless or unintelligible; no real speech, no names, no story dialogue."
      - "Never explained."
  - id: visitor_marks
    status: "PLANNED for milestone 8 (multiplayer), together with the inventory."
    default: true
    from_canon: [X-006]
    intent: "Visitors leave simple chalk marks and pebble patterns that other visitors can see, from a fixed preset list, using materials they carry."
    economy:
      - "A mark needs materials. Chalk marks spend chalk charges; pebble patterns spend pebbles. See design/inventory.yaml. This is the main limit on marks."
      - "Chalk: symbols and arrows cost 1 charge; phrases cost 2. Chalk is an outside item, so it is rare."
      - "Pebbles: cairn 4, arrow 5, line 6, wave 7, star 7, circle 8, spiral 10. Pebbles are gathered from tide-left banks, so anyone can make pebble marks."
    safety:
      - "No free text, no custom images, no names or user ids on screen. Presets only."
      - "Presets are authored by us; each must be generic and kind. No presets for names, places outside the House, numbers that could be personal, or anything that can be combined into sentences."
      - "Anti-spam backstop only: at most 12 live marks per hall, one mark every 5 seconds per visitor, marks never stack on top of one another. The inventory is the real limiter."
      - "Shared in memory among connected visitors only. Nothing is stored or sent to a server."
    memory:
      model: "witness-based"
      rules:
        - "Marks and dropped items belong to the hall they are in. Each hall's shared state is its own Yjs subdocument."
        - "A visitor carries a hall's subdocument if they have been in that hall (or standing in one of its doorways) while the state existed. Late arrivals receive it from a carrier when they enter."
        - "A hall's state exists only while at least one connected visitor carries it. When the last carrier leaves, the hall forgets: marks and dropped items there are gone, even if other visitors remain elsewhere."
        - "So a mark lasts as long as someone is connected who has, or could have, seen it. The author leaving does not erase it if another carrier remains."
      consequences: ["Memory is naturally bounded: no one carries the whole House.", "A hall nobody visits in a session never has marks."]
    washing:
      - "When tide water reaches a mark's hall, chalk is washed away and pebbles are scattered into nearby halls. Marks on high ledges survive."
    chalk_presets:
      arrows: [north, south, east, west, up-stairs, down-stairs]
      symbols: [circle, small-star, wave, sun, moon, tally-stroke, spiral]
      phrases: ["Hello", "Peace", "Good morning", "Good night", "This way", "Rest here", "Fish here", "Water ahead", "Water rising", "Be careful", "Thank you"]
      colours: [white, blue, pink, yellow]
    pebble_presets:
      patterns: [arrow, line, circle, spiral, cairn, wave, star]
      note: "Pebble messages are pictures only, never letters."
    ambient_rare:
      - "Very rarely, a preset mark is found with no visible author, so the hall seems to have been visited. Generated from the seed and time, no meaning, same presets."

  - id: previous_visitors
    default: true
    from_canon: [RC-001, RC-002, RC-003, RC-004, RC-005, RC-006, RC-008]
    intent: "Very rare leftovers from earlier, anonymous visitors, already present in the world when you arrive, there to be found."
    rules:
      - "Part of the initial world state: placed deterministically from the seed, so the same seed has the same relics for everyone. They are not generated per player."
      - "Very rare by design. Densities (before relicDensity): First Vestibule and halls within 5 steps about 1 in 25 halls; beyond that about 1 in 400 halls. The far halls are almost empty."
      - "Anonymous: no names, no dates, no story identification. Nothing links relics to each other."
      - "Taking, moving or dropping a relic changes shared state under the witness rule from visitor_marks.memory; a fresh join of the same seed sees them back where they began. NOTE: picking them up needs the inventory, so it arrives with multiplayer (milestone 8). Until then relics are examine-only."
    kinds:
      - {kind: litter, where: "First Vestibule and nearby halls, especially the hollow under the Great Staircase", items: [packet, cardboard-box, wrapper], pick_up: true, usable: false, note: "Can be piled up; burn-able as fuel if fire is ever added."}
      - {kind: old-sleeping-bag, where: "exactly one, in the hollow under the Great Staircase of the First Vestibule", pick_up: true, usable: "warmth in cloud or winter"}
      - {kind: crumpled-note, where: "rare, blowing about the First Vestibule region or caught in corners", frequency: "about 1 in 1500 halls beyond the origin zone", text: "from our authored fragment list below, always partly illegible"}
      - {kind: torn-scraps, where: "88th Western Hall (pavement, gull nests); easiest to gather in late summer or early autumn", counts: "10 to 20 on the pavement, 5 to 10 in nests", text: "each scrap is illegible except for at most one authored fragment; collecting scraps does not unlock anything"}
      - {kind: old-door-marks, where: "faded chalk arrows and tally strokes on doorframes below a tall person's eye level, in short runs of 5 to 13 doors", frequency: "about 1 run per 500 halls (each run covers 5 to 13 halls, so about 2% of halls carry a mark). 1 per 200 would have meant nearly 5% of halls, which is not very rare.", marks: "presets only (arrows, tally, circle); never words"}
      - {kind: small-stray, where: "very rare", items: [pen, empty-tin, scrap-of-cloth]}
    authored_fragments:
      note: "Written by us, original, generic and kind. Always damaged: only a few words visible. No names, places outside the House, or story references."
      list: ["...the sea was loud all night...", "...keep the small door on your left...", "...bring something warm...", "...I counted forty-one steps...", "...do not go east after the rain...", "...the birds were restless...", "...mark the doors as you go...", "...the water rose to my knees...", "...somewhere dry to rest..."]
    discovery:
      - "Examining a relic shows our authored description; no relic gives a reward."
      - "Each visitor may keep a private, local-only list of what they have found. Not shared, not stored on any server. Implemented: the `found` command; the list is kept in this device's browser storage, per world seed."
    status: "IMPLEMENTED (milestone 4b), examine-only. See design/relics-and-outside.md."
